server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Middleware API (path is passed through unchanged, incl. the /api prefix).
    location /api/ {
        proxy_pass http://api:5000;
    }

    # Angular SPA: unknown paths fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
