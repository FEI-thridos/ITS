# Environment variables come only from env files (no defaults here):
#   docker/.env       development values, loaded automatically
#   docker/.env.prod  production placeholders replaced by CD; --env-file replaces docker/.env
# ASPNETCORE_ENVIRONMENT also names the volumes, so Development and Production never share data.
# Development:  docker compose -f docker/docker-compose.yml up --build
# Production:   docker compose -f docker/docker-compose.yml --env-file docker/.env.prod build
#               docker compose -f docker/docker-compose.yml --env-file docker/.env.prod up -d
name: kuka-fm-middleware

services:
  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:?}
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:2026.1.17182
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

# Separate volumes per environment, named by ASPNETCORE_ENVIRONMENT (Development / Production).
volumes:
  postgres-data:
    name: kuka-fm-middleware_postgres-data-${ASPNETCORE_ENVIRONMENT:?}
  seq-data:
    name: kuka-fm-middleware_seq-data-${ASPNETCORE_ENVIRONMENT:?}
