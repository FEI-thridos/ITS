# CI - npm/NuGet vulnerability checks, frontend build, backend build + unit tests with coverage,
# SonarQube analysis (backend + frontend; coverage from backend only). Manual runs only.
#
# Required pipeline variables (defined on the pipeline):
#   AgentPoolName    - name of the self-hosted agent pool (Windows agent on the Docker host)
#   AgentName        - name of the agent in that pool
#   SonarProjectKey  - SonarQube project key
#   SonarCaCertPath  - path to the PEM file of the SonarQube server certificate on the agent host
# Required service connection: 'SonarQube' (SonarQube Server).

trigger: none
pr: none

pool:
  name: $(AgentPoolName)
  demands:
    - Agent.Name -equals $(AgentName)

variables:
  BuildConfiguration: Release
  TestResultsDir: $(Agent.TempDirectory)\TestResults

steps:
  - checkout: self
    clean: true

  - task: UseDotNet@2
    displayName: Install .NET SDK (backend/global.json)
    inputs:
      packageType: sdk
      useGlobalJson: true
      workingDirectory: backend

  - task: UseNode@1
    displayName: Install Node.js 24
    inputs:
      version: 24.x

  # Frontend
  - powershell: |
      npm ci
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      npm audit --audit-level=high
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      npx ng build --configuration production
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    displayName: Frontend - npm ci, npm audit, production build
    errorActionPreference: continue   # native stderr must not abort; exit codes are checked explicitly
    workingDirectory: frontend

  # Backend + SonarQube: the .NET scanner wraps build + test. projectBaseDir = repo root, so frontend/
  # (JS/TS/HTML/CSS, analysed with the Node installed above) is in scope, not only the MSBuild projects.
  - task: SonarQubePrepare@7
    displayName: SonarQube - prepare
    inputs:
      SonarQube: SonarQube
      scannerMode: dotnet
      projectKey: $(SonarProjectKey)
      extraProperties: |
        sonar.cs.opencover.reportsPaths=$(TestResultsDir)\*\coverage.opencover.xml
        sonar.cs.vstest.reportsPaths=$(TestResultsDir)\*.trx
        sonar.projectBaseDir=$(Build.SourcesDirectory)
        sonar.exclusions=**/Data/Migrations/**,frontend/node_modules/**,frontend/dist/**,frontend/.angular/**
        sonar.coverage.exclusions=frontend/**,**/Data/Migrations/**
    env:   # self-signed SonarQube cert: Node task code uses the PEM, the Java scanner engine the Windows root store
      NODE_EXTRA_CA_CERTS: $(SonarCaCertPath)
      SONAR_SCANNER_OPTS: -Djavax.net.ssl.trustStoreType=Windows-ROOT

  - powershell: |
      dotnet restore KukaFm.Middleware.slnx
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      dotnet build KukaFm.Middleware.slnx --no-restore -c $(BuildConfiguration)
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    displayName: Backend - build
    errorActionPreference: continue   # native stderr must not abort; exit codes are checked explicitly
    workingDirectory: backend

  - powershell: |
      $output = dotnet list KukaFm.Middleware.slnx package --vulnerable --include-transitive
      $output
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      if ($output -match 'has the following vulnerable packages') {
        Write-Host '##vso[task.logissue type=error]Vulnerable NuGet packages found.'
        exit 1
      }
    displayName: Backend - NuGet vulnerability check
    errorActionPreference: continue   # native stderr must not abort; exit codes are checked explicitly
    workingDirectory: backend

  - powershell: |
      dotnet test KukaFm.Middleware.slnx --no-build -c $(BuildConfiguration) --logger trx --results-directory "$(TestResultsDir)" --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    displayName: Backend - unit tests with coverage
    errorActionPreference: continue   # native stderr must not abort; exit codes are checked explicitly
    workingDirectory: backend

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '*.trx'
      searchFolder: $(TestResultsDir)
      testRunTitle: Backend unit tests

  - task: SonarQubeAnalyze@7
    displayName: SonarQube - analyze
    continueOnError: true   # an unreachable SonarQube server must not fail CI
    env:
      NODE_EXTRA_CA_CERTS: $(SonarCaCertPath)
      SONAR_SCANNER_OPTS: -Djavax.net.ssl.trustStoreType=Windows-ROOT

  - task: SonarQubePublish@7
    displayName: SonarQube - publish quality gate result
    continueOnError: true   # the quality gate is reported only; it never fails the run
    inputs:
      pollingTimeoutSec: '300'
    env:
      NODE_EXTRA_CA_CERTS: $(SonarCaCertPath)
      SONAR_SCANNER_OPTS: -Djavax.net.ssl.trustStoreType=Windows-ROOT
