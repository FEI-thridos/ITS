# CD - deploy to Docker Desktop (Linux containers) on the agent host. Manual runs only.
# The API applies EF Core migrations on startup, so there is no migration step.
#
# Required pipeline variables (defined on the pipeline):
#   AgentPoolName    - name of the self-hosted agent pool (Windows agent on the Docker host)
#   AgentName        - name of the agent in that pool
#   DeployPath       - target folder on the agent host, e.g. C:\deploy\kuka-fm-middleware
#   DbName           - PostgreSQL database name     -> __DB_NAME__
#   DbUser           - PostgreSQL user              -> __DB_USER__            (mark secret)
#   DbPassword       - PostgreSQL password          -> __DB_PASSWORD__        (mark secret)
#   KukaAccessToken  - KUKA FM Authorization token  -> __KUKA_ACCESS_TOKEN__  (mark secret)
# Values must not contain a single quote or a line break (docker/.env.prod uses single-quoted values);
# DbName, DbUser and DbPassword must also not contain ';' (Npgsql connection string).
#
# The repo is mirrored to $(DeployPath) and placeholders are replaced there only; the agent workspace
# keeps its placeholders. Docker volumes are not files in $(DeployPath), so the mirror never touches them.
# $(DeployPath) must be a dedicated folder holding only this deployment - the mirror deletes anything else in it.
# DbUser/DbPassword take effect only when the Production postgres volume is first created; changing them later
# needs a manual volume reset. Do not run the dev stack on the deployment host (same project name and port 8080).

trigger: none
pr: none

pool:
  name: $(AgentPoolName)
  demands:
    - Agent.Name -equals $(AgentName)

variables:
  ComposeArgs: -f docker/docker-compose.yml --env-file docker/.env.prod

steps:
  - checkout: self
    clean: true

  - powershell: |
      $values = [ordered]@{
        'DeployPath'            = $env:DEPLOY_PATH
        '__DB_NAME__'           = $env:DB_NAME
        '__DB_USER__'           = $env:DB_USER
        '__DB_PASSWORD__'       = $env:DB_PASSWORD
        '__KUKA_ACCESS_TOKEN__' = $env:KUKA_ACCESS_TOKEN
      }
      foreach ($v in $values.GetEnumerator()) {
        # An undefined pipeline variable stays as the literal macro text '$(Name)'.
        if ([string]::IsNullOrEmpty($v.Value) -or $v.Value.StartsWith('$(') -or $v.Value -match "['`r`n]") {
          throw "Pipeline variable for $($v.Key) is not defined or contains a single quote / line break."
        }
        if ($v.Key -like '__DB_*' -and ($v.Value.Contains(';') -or $v.Value.StartsWith('"') -or $v.Value -ne $v.Value.Trim())) {
          throw "Pipeline variable for $($v.Key) must not contain ';', start with a double quote or have leading/trailing whitespace."
        }
      }
    displayName: Validate pipeline variables
    env:
      DEPLOY_PATH: $(DeployPath)
      DB_NAME: $(DbName)
      DB_USER: $(DbUser)
      DB_PASSWORD: $(DbPassword)
      KUKA_ACCESS_TOKEN: $(KukaAccessToken)

  - powershell: |
      # /MIR mirrors the checkout (removed files disappear); .git is neither copied nor deleted.
      # A trailing '\' would escape the closing quote of a native command argument.
      $target = $env:DEPLOY_PATH.TrimEnd('\')
      robocopy "$(Build.SourcesDirectory)" $target /MIR /XD .git /NFL /NDL /NP /R:2 /W:5
      # robocopy exit codes 0-7 mean success, 8 and above mean failure.
      if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
      exit 0
    displayName: Copy repo to $(DeployPath)
    errorActionPreference: continue   # native stderr must not abort; exit codes are checked explicitly
    env:
      DEPLOY_PATH: $(DeployPath)

  - powershell: |
      $utf8 = New-Object System.Text.UTF8Encoding $false
      $placeholders = [ordered]@{
        '__DB_NAME__'           = $env:DB_NAME
        '__DB_USER__'           = $env:DB_USER
        '__DB_PASSWORD__'       = $env:DB_PASSWORD
        '__KUKA_ACCESS_TOKEN__' = $env:KUKA_ACCESS_TOKEN
      }
      $appSettings = Join-Path $env:DEPLOY_PATH 'backend\src\KukaFm.Middleware.Api\appsettings.Production.json'
      $envFile = Join-Path $env:DEPLOY_PATH 'docker\.env.prod'

      # appsettings.Production.json: placeholders sit inside JSON strings, so insert JSON-escaped values.
      $json = [IO.File]::ReadAllText($appSettings)
      foreach ($p in $placeholders.GetEnumerator()) {
        $escaped = ConvertTo-Json $p.Value
        $json = $json.Replace($p.Key, $escaped.Substring(1, $escaped.Length - 2))
      }
      $null = $json | ConvertFrom-Json   # throws if the result is not valid JSON
      [IO.File]::WriteAllText($appSettings, $json, $utf8)

      # docker/.env.prod: values are single-quoted, so a literal replacement is safe.
      $content = [IO.File]::ReadAllText($envFile)
      foreach ($p in $placeholders.GetEnumerator()) { $content = $content.Replace($p.Key, $p.Value) }
      [IO.File]::WriteAllText($envFile, $content, $utf8)

      foreach ($file in $appSettings, $envFile) {
        if (Select-String -Path $file -Pattern '__[A-Z0-9_]+__' -CaseSensitive -Quiet) { throw "Unreplaced placeholder left in $file" }
      }
    displayName: Replace placeholders in $(DeployPath)
    env:
      DEPLOY_PATH: $(DeployPath)
      DB_NAME: $(DbName)
      DB_USER: $(DbUser)
      DB_PASSWORD: $(DbPassword)
      KUKA_ACCESS_TOKEN: $(KukaAccessToken)

  - powershell: |
      docker compose $(ComposeArgs) build --no-cache
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      docker compose $(ComposeArgs) up -d
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    displayName: Docker compose build + up
    errorActionPreference: continue   # native stderr must not abort; exit codes are checked explicitly
    workingDirectory: $(DeployPath)

  - powershell: |
      $ProgressPreference = 'SilentlyContinue'
      foreach ($url in 'http://localhost:8080', 'http://localhost:8080/api/health') {
        $ok = $false
        for ($i = 1; $i -le 30 -and -not $ok; $i++) {
          try {
            $ok = (Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 5).StatusCode -eq 200
          } catch {
            Write-Host "Attempt $i/30: $url not ready ($($_.Exception.Message))"
          }
          if (-not $ok) { Start-Sleep -Seconds 5 }
        }
        if (-not $ok) {
          docker compose $(ComposeArgs) logs --tail 200 api
          throw "Smoke check failed: $url"
        }
        Write-Host "OK: $url"
      }
    displayName: Smoke check
    errorActionPreference: continue   # native stderr must not abort; exit codes are checked explicitly
    workingDirectory: $(DeployPath)

  - powershell: |
      docker builder prune -af
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    displayName: Prune docker build cache
    errorActionPreference: continue   # native stderr must not abort; exit codes are checked explicitly
    condition: always()
